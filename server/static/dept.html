<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CareVoice AI — Department Dashboard</title>
<style>
/* Styled to match the website admin dashboard (admin.html): slate bg, white
   surfaces, indigo brand accent, topbar with logo badge, same card/button look. */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#f1f5f9; --surface:#ffffff; --surface2:#f8fafc; --border:#e2e8f0;
  --accent:#4f46e5; --accent2:#7c3aed;
  --green:#16a34a; --yellow:#d97706; --red:#dc2626; --cyan:#0891b2;
  --text:#0f172a; --muted:#64748b; --font:system-ui,-apple-system,sans-serif;
}
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

.topbar { display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:58px;
  background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
.topbar-logo { display:flex; align-items:center; gap:10px; }
.topbar-logo svg { color:var(--accent); }
.topbar-logo h1 { font-size:1.1rem; font-weight:800; }
.topbar-logo span { font-size:.7rem; font-weight:600; color:var(--accent); background:rgba(79,70,229,.12); padding:2px 8px; border-radius:20px; border:1px solid rgba(79,70,229,.25); text-transform:capitalize; }
.topbar-right { display:flex; align-items:center; gap:14px; }
.dept-badge { font-size:.78rem; color:var(--muted); }
.dept-badge strong { color:var(--text); }
.conn { font-size:.73rem; color:var(--muted); display:flex; align-items:center; gap:5px; }
.dot { width:8px; height:8px; border-radius:50%; background:#cbd5e1; }
.dot.on { background:var(--green); }
.btn-logout { background:transparent; border:1px solid var(--border); color:var(--muted); padding:5px 14px; border-radius:6px; cursor:pointer; font-size:.82rem; }
.btn-logout:hover { border-color:var(--red); color:var(--red); }

.wrap { max-width:900px; width:100%; margin:20px auto; padding:0 20px 48px; }
.page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.page-head h2 { font-size:1.15rem; font-weight:800; }
.pending-pill { background:var(--accent); color:#fff; border-radius:999px; padding:2px 11px; font-size:.82rem; font-weight:700; }
.pending-pill.zero { background:#cbd5e1; color:#475569; }
label.snd { font-size:.78rem; color:var(--muted); display:flex; align-items:center; gap:5px; }

.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
.card.preparing { border-left:4px solid var(--yellow); }
.card.delivered { border-left:4px solid var(--green); opacity:.72; }
.card.rejected  { border-left:4px solid var(--red); opacity:.6; }
.card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.room { font-weight:800; font-size:1.05rem; }
.meta { color:var(--muted); font-size:.78rem; margin:3px 0 10px; }
.quote { font-size:.95rem; margin-bottom:6px; }
.status { font-size:.68rem; font-weight:800; padding:3px 9px; border-radius:6px; text-transform:uppercase; letter-spacing:.03em; background:var(--surface2); color:#334155; border:1px solid var(--border); }
.status.preparing { background:#fef3c7; color:#92400e; border-color:#fde68a; }
.status.delivered { background:#dcfce7; color:#166534; border-color:#bbf7d0; }
.status.pending_approval { background:#e0e7ff; color:#3730a3; border-color:#c7d2fe; }
.status.approved { background:#dbeafe; color:#1e40af; }
.status.rejected { background:#fee2e2; color:#991b1b; border-color:#fecaca; }
.status.acknowledged { background:#dbeafe; color:#1e40af; }
.status.pending { background:#fef3c7; color:#92400e; border-color:#fde68a; }
.status.done { background:#dcfce7; color:#166534; border-color:#bbf7d0; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
button.btn { border:none; border-radius:8px; padding:8px 14px; font-weight:600; font-size:.83rem; cursor:pointer; }
.btn-prim { background:var(--accent); color:#fff; }
.btn-prim:hover { background:#4338ca; }
.btn-ok { background:var(--green); color:#fff; }
.menu { margin-top:10px; display:grid; gap:7px; }
.menu-item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border); border-radius:9px; font-size:.86rem; }
.menu-item.rec { border-color:#86efac; background:#f0fdf4; }
.menu-item .desc { font-size:.72rem; color:var(--muted); }
.rec-pill { font-size:.64rem; background:var(--green); color:#fff; padding:2px 7px; border-radius:5px; font-weight:700; }
.diet-tag { font-size:.72rem; color:var(--yellow); font-weight:700; }
.rep { background:#fef3c7; color:#92400e; border-radius:6px; padding:1px 7px; font-size:.72rem; font-weight:700; }
.empty { text-align:center; color:var(--muted); padding:48px 0; font-size:.92rem; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
    <h1>CareVoice AI</h1>
    <span id="dept-badge">Department</span>
  </div>
  <div class="topbar-right">
    <span class="conn"><span id="conn-dot" class="dot"></span><span id="conn-txt">connecting…</span></span>
    <span class="dept-badge"><strong id="who">—</strong></span>
    <label class="snd"><input type="checkbox" id="sound" checked /> sound</label>
    <button class="btn-logout" onclick="logout()">Sign out</button>
  </div>
</div>

<div class="wrap">
  <div class="page-head">
    <h2 id="dept-title">Orders</h2>
    <span id="count" class="pending-pill zero">0</span>
  </div>
  <div id="list"></div>
  <div id="empty" class="empty">No pending orders. New requests will appear here.</div>
</div>

<script>
const BASE = window.location.origin;
let token = null;
try { if (window.CareVoiceApp && window.CareVoiceApp.getToken) token = window.CareVoiceApp.getToken() || null; } catch(e){}
if (token) localStorage.setItem('cv_token', token); else token = localStorage.getItem('cv_token');
if (!token) { window.location.href='/login'; }
const orders = new Map();
let department = localStorage.getItem('cv_department') || '';
let ws=null, wsRetry=0;

async function api(path, opts={}) {
  const res = await fetch(BASE+path, { ...opts, headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json', ...(opts.headers||{}) }});
  if (res.status===401||res.status===403) { localStorage.clear(); window.location.href='/login'; throw new Error('Unauthorized'); }
  if (!res.ok) { const t=await res.json().catch(()=>({})); throw new Error(t.detail||('HTTP '+res.status)); }
  return res.status===204?null:res.json();
}
function logout(){ localStorage.clear(); if (window.CareVoiceApp && window.CareVoiceApp.logout) return window.CareVoiceApp.logout(); window.location.href='/login'; }
function beep(){ if(!document.getElementById('sound').checked)return; try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination); o.type='sine';o.frequency.value=880; g.gain.setValueAtTime(.001,c.currentTime); g.gain.exponentialRampToValueAtTime(.3,c.currentTime+.02); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5); o.start();o.stop(c.currentTime+.5);}catch(e){} }
function esc(s){ return (s||'').replace(/</g,'&lt;'); }

function cardHtml(o){
  const isOrder = (o.kind==='food'||o.kind==='medicine');
  // Food/medicine show the fulfilment order_status; facility shows its ack state.
  const st = isOrder ? (o.order_status||'requested') : (o.state||'pending');
  const cls=(st==='preparing'||st==='delivered'||st==='rejected')?st:'';
  const rep=o.repeat_count>0?`<span class="rep">×${o.repeat_count+1}</span>`:'';
  const diet=(o.diet_restriction&&o.diet_restriction!=='none')?`<span class="diet-tag">diet: ${esc(o.diet_restriction)}</span>`:'';
  let body=`<div class="card-top"><span class="room">Room ${esc(o.room_id)} ${rep}</span><span class="status ${st}">${st.replace('_',' ')}</span></div>
    <div class="meta">${esc(o.kind||o.department)}${o.floor?' · floor '+esc(o.floor):''} · ${new Date(o.created_at).toLocaleTimeString()} ${diet}</div>
    <div class="quote">“${esc(o.transcript)}”${o.item_name?` — <b>${esc(o.item_name)}</b>${o.item_detail?` <span class="meta">(${esc(o.item_detail)})</span>`:''}`:''}</div>`;
  if (o.ordered_by_role)
    body+=`<div class="meta">Ordered by ${esc(o.ordered_by_role)}${o.ordered_by?' ('+esc(o.ordered_by)+')':''}</div>`;
  if (o.item_notes)
    body+=`<div class="meta" style="color:#92400e">${esc(o.item_notes)}</div>`;
  let actions='';
  const kind=o.kind||'facility';
  if (kind==='food') {
    // Food lifecycle: prepare → deliver (nurse approves first).
    if (st==='approved') actions+=`<button class="btn btn-prim" onclick="markPreparing(${o.id})">Start preparing</button>`;
    if (st==='approved'||st==='preparing') actions+=`<button class="btn btn-ok" onclick="markDelivered(${o.id})">Mark delivered</button>`;
  } else if (kind==='medicine') {
    // Medicine: no preparing step — pharmacy just dispenses + delivers.
    if (st==='approved'||st==='preparing') actions+=`<button class="btn btn-ok" onclick="markDelivered(${o.id})">Mark delivered</button>`;
  } else {
    // Facility / housekeeping: a simple acknowledge → done flow.
    const dstate = o.state || 'pending';
    if (dstate==='pending')      actions+=`<button class="btn btn-prim" onclick="ackReq(${o.id})">Acknowledge</button>`;
    if (dstate!=='done')         actions+=`<button class="btn btn-ok" onclick="doneReq(${o.id})">Mark done</button>`;
    if (dstate==='pending'||dstate==='acknowledged')
      actions+=`<button class="btn" style="background:#fee2e2;color:#b91c1c" onclick="notMine(${o.id})">Not mine</button>`;
  }
  if (actions) body+=`<div class="actions">${actions}</div>`;
  return body;
}
function render(){
  const rows=[...orders.values()].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  const active=rows.filter(o=>{
    const isOrder=(o.kind==='food'||o.kind==='medicine');
    return isOrder ? (o.order_status!=='delivered'&&o.order_status!=='rejected')
                   : (o.state!=='done'&&o.state!=='cancelled'&&o.state!=='escalated');
  });
  const c=document.getElementById('count'); c.textContent=active.length; c.className='pending-pill'+(active.length?'':' zero');
  document.getElementById('empty').style.display=rows.length?'none':'block';
  document.getElementById('list').innerHTML=rows.map(o=>`<div class="card ${o.order_status||''}">${cardHtml(o)}</div>`).join('');
}
async function loadMenu(id){ try{ const d=await api(`/department/order/${id}/menu`); const el=document.getElementById(`menu-${id}`);
  el.innerHTML=d.menu.map(m=>`<div class="menu-item ${m.recommended?'rec':''}"><div><b>${esc(m.name)}</b> ${m.recommended?'<span class="rec-pill">fits diet</span>':''}<div class="desc">${esc(m.description)}</div></div><button class="btn btn-prim" onclick="chooseItem(${id}, ${JSON.stringify(m.name).replace(/"/g,'&quot;')})">Choose</button></div>`).join('');
 }catch(e){ alert(e.message);} }
async function chooseItem(id,name){ try{ await api(`/department/order/${id}/choose`,{method:'POST',body:JSON.stringify({item_name:name})}); const o=orders.get(id); if(o){o.item_name=name;o.order_status='pending_approval';render();} }catch(e){ alert(e.message);} }
async function markPreparing(id){ try{ await api(`/department/order/${id}/preparing`,{method:'POST'}); }catch(e){ alert(e.message);} }
async function markDelivered(id){ try{ await api(`/department/order/${id}/delivered`,{method:'POST'}); }catch(e){ alert(e.message);} }
async function ackReq(id){ try{ await api(`/department/${id}/acknowledge`,{method:'POST'}); const o=orders.get(id); if(o){o.state='acknowledged';render();} }catch(e){ alert(e.message);} }
async function notMine(id){ if(!confirm('Pass this task to the next person on the housekeeping team?')) return;
  try{ const r=await api(`/department/${id}/not-mine`,{method:'POST',body:JSON.stringify({reason:'not mine'})}); orders.delete(id); render(); }catch(e){ alert(e.message);} }
async function doneReq(id){ try{ await api(`/department/${id}/done`,{method:'POST'}); const o=orders.get(id); if(o){o.state='done';render();} }catch(e){ alert(e.message);} }

function upsert(o,doBeep){ const prev=orders.get(o.request_id||o.id);
  orders.set(o.request_id||o.id,{ id:o.request_id||o.id, alert_id:o.alert_id, department:o.department, kind:o.kind||(prev?prev.kind:'facility'), room_id:o.room_id, floor:o.floor, transcript:o.transcript,
    order_status:o.order_status||(prev?prev.order_status:'requested'), state:o.state||(prev?prev.state:'pending'),
    ordered_by:o.ordered_by??(prev?prev.ordered_by:null), ordered_by_role:o.ordered_by_role??(prev?prev.ordered_by_role:null),
    item_notes:o.item_notes??(prev?prev.item_notes:null),
    item_name:o.item_name??(prev?prev.item_name:null), item_detail:o.item_detail??(prev?prev.item_detail:null),
    needs_approval:o.needs_approval, diet_restriction:o.diet_restriction??(prev?prev.diet_restriction:null), created_at:o.created_at||(prev?prev.created_at:new Date().toISOString()), repeat_count:o.repeat_count||0 });
  if(doBeep)beep(); render(); }
async function loadQueue(){ const d=await api('/department/requests'); department=d.department||department;
  document.getElementById('dept-badge').textContent=department; document.getElementById('dept-title').textContent=department.charAt(0).toUpperCase()+department.slice(1)+' orders';
  orders.clear(); (d.requests||[]).forEach(r=>upsert(r,false)); render(); }
function connectWs(){ const proto=location.protocol==='https:'?'wss':'ws'; ws=new WebSocket(`${proto}://${location.host}/ws/department?token=${encodeURIComponent(token)}`);
  ws.onopen=()=>{ wsRetry=0; document.getElementById('conn-dot').className='dot on'; document.getElementById('conn-txt').textContent='live'; };
  ws.onclose=()=>{ document.getElementById('conn-dot').className='dot'; document.getElementById('conn-txt').textContent='reconnecting…'; wsRetry=Math.min(wsRetry+1,6); setTimeout(connectWs, Math.min(15000,1000*Math.pow(1.6,wsRetry))); };
  ws.onerror=()=>{ try{ws.close();}catch(_){} };
  ws.onmessage=e=>{ if(e.data==='ping'){try{ws.send('pong');}catch(_){} return;} let p; try{p=JSON.parse(e.data);}catch(_){return;}
    try{ if(p.event==='connected')document.getElementById('who').textContent=p.username;
      else if(p.event==='order_new')upsert(p,true); else if(p.event==='order_update')upsert(p,false);
      else if(p.event==='department_request')upsert({...p,kind:p.kind||'facility'},!p.backlog);
      else if(p.event==='department_cancelled'){orders.delete(p.request_id);render();} }catch(err){ console.warn(err); } };
}
(async function(){ try{ await loadQueue(); }catch(e){} connectWs(); })();
// Safety net: re-read the queue every 15 s (and when the tab comes back), so a
// dropped socket can never hide a new request. Beep for requests that are new.
async function pollQueue(){ if(document.visibilityState!=='visible')return;
  try{ const before=new Set(orders.keys()); await loadQueue();
    if([...orders.keys()].some(k=>!before.has(k)))beep(); }catch(e){} }
setInterval(pollQueue,15000);
document.addEventListener('visibilitychange',pollQueue);
</script>
</body>
</html>
